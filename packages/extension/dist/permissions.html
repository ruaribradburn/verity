<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verity — Grant Permissions</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", "Aptos", "Helvetica Neue", sans-serif;
        background: #f4efe6;
        color: #1d140e;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .card {
        background: white;
        border-radius: 2rem;
        border: 1px solid rgba(0,0,0,0.08);
        box-shadow: 0 18px 60px rgba(0,0,0,0.06);
        padding: 2.5rem;
        max-width: 520px;
        width: 100%;
      }
      .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.34em;
        color: #b45309;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.7;
        color: #57534e;
        margin-bottom: 1.5rem;
      }
      .perm-list {
        list-style: none;
        margin-bottom: 1.5rem;
      }
      .perm-item {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-radius: 1rem;
        border: 1px solid #e7e5e4;
        background: #fafaf9;
        margin-bottom: 0.5rem;
      }
      .perm-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 5px;
        flex-shrink: 0;
      }
      .perm-dot.pending { background: #f59e0b; }
      .perm-dot.granted { background: #22c55e; }
      .perm-name {
        font-size: 0.85rem;
        font-weight: 500;
        color: #1c1917;
      }
      .perm-desc {
        font-size: 0.75rem;
        color: #78716c;
        margin-top: 2px;
      }
      .actions { display: flex; gap: 0.75rem; }
      button {
        font: inherit;
        background: #0c0a09;
        color: #fafaf9;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
        flex: 1;
      }
      button:hover { background: #b45309; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary {
        background: white;
        color: #44403c;
        border: 1px solid #d6d3d1;
        flex: none;
      }
      button.secondary:hover { border-color: #0c0a09; color: #0c0a09; background: white; }
      .status {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: #57534e;
        text-align: center;
      }
      .status.success { color: #15803d; }
      .status.error { color: #b91c1c; }
    </style>
    <script type="module" crossorigin src="./assets/permissions-D47oA-UF.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/permissions-check-DCYYwYxU.js">
  </head>
  <body>
    <div class="card">
      <div class="label">Verity permissions</div>
      <h1>Grant all permissions</h1>
      <p>
        Verity needs <strong>microphone</strong> access for voice input,
        <strong>tab</strong> access for page research, and
        <strong>local API</strong> access to communicate with the Verity backend.
        Grant everything below, then return to the side panel.
      </p>

      <ul class="perm-list" id="perm-list"></ul>

      <div class="actions">
        <button id="grant">Grant all permissions</button>
        <button class="secondary" id="refresh">Refresh</button>
      </div>
      <div id="status" class="status"></div>
    </div>
  </body>
</html>
