<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verity — Grant Permissions</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #111110;
        color: #ededec;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: #1a1a19;
        border-radius: 1.25rem;
        border: 1px solid rgba(255,255,255,0.08);
        padding: 2.5rem;
        max-width: 420px;
        width: 100%;
      }
      .logo {
        width: 48px;
        height: 48px;
        background: rgba(232, 165, 69, 0.14);
        border-radius: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }
      .logo svg { display: block; }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-align: center;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.82rem;
        line-height: 1.6;
        color: #a1a09e;
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .perm-list {
        list-style: none;
        margin-bottom: 1.5rem;
      }
      .perm-item {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255,255,255,0.08);
        background: #222221;
        margin-bottom: 0.5rem;
      }
      .perm-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 5px;
        flex-shrink: 0;
      }
      .perm-dot.pending { background: #e8a545; }
      .perm-dot.granted { background: #4ade80; }
      .perm-name {
        font-size: 0.82rem;
        font-weight: 500;
        color: #ededec;
      }
      .perm-desc {
        font-size: 0.75rem;
        color: #706f6c;
        margin-top: 2px;
        line-height: 1.5;
      }
      .actions { display: flex; gap: 0.75rem; }
      button {
        font: inherit;
        background: #e8a545;
        color: #111110;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 1.5rem;
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: filter 0.2s;
        flex: 1;
      }
      button:hover { filter: brightness(1.1); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary {
        background: transparent;
        color: #a1a09e;
        border: 1px solid rgba(255,255,255,0.14);
        flex: none;
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
      button.secondary:hover { color: #ededec; border-color: rgba(255,255,255,0.25); filter: none; }
      .status {
        margin-top: 1.25rem;
        font-size: 0.78rem;
        color: #706f6c;
        text-align: center;
      }
      .status.success { color: #4ade80; }
      .status.error { color: #f87171; }
    </style>
    <script type="module" crossorigin src="./assets/permissions-D6P14HO1.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/permissions-check-C7RG9m_U.js">
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 3C7.03 3 3 7.03 3 12s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16.5c-4.14 0-7.5-3.36-7.5-7.5S7.86 4.5 12 4.5s7.5 3.36 7.5 7.5-3.36 7.5-7.5 7.5z" fill="#e8a545" opacity="0.5" />
          <circle cx="12" cy="12" r="3" fill="#e8a545" />
        </svg>
      </div>
      <h1>Grant permissions</h1>
      <p>
        Verity needs <strong style="color:#ededec">microphone</strong> access for voice input
        and <strong style="color:#ededec">local API</strong> access to power live analysis.
      </p>

      <ul class="perm-list" id="perm-list"></ul>

      <div class="actions">
        <button id="grant">Grant access</button>
        <button class="secondary" id="refresh">Refresh</button>
      </div>
      <div id="status" class="status"></div>
    </div>
  </body>
</html>
