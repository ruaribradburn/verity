<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verity — Grant Permissions</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", "Aptos", "Helvetica Neue", sans-serif;
        background: #f4efe6;
        color: #1d140e;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .card {
        background: white;
        border-radius: 2rem;
        border: 1px solid rgba(0,0,0,0.08);
        box-shadow: 0 18px 60px rgba(0,0,0,0.06);
        padding: 2.5rem;
        max-width: 460px;
        width: 100%;
        text-align: center;
      }
      .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.34em;
        color: #b45309;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.7;
        color: #57534e;
        margin-bottom: 1.5rem;
      }
      button {
        font: inherit;
        background: #0c0a09;
        color: #fafaf9;
        border: none;
        border-radius: 9999px;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: #b45309; }
      button:disabled { opacity: 0.5; cursor: default; }
      .status {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: #57534e;
      }
      .status.success { color: #15803d; }
      .status.error { color: #b91c1c; }
    </style>
    <script type="module" crossorigin src="./assets/permissions-ZTcQYSNE.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <div class="card">
      <div class="label">Verity permissions</div>
      <h1>Microphone access</h1>
      <p>
        Chrome needs your permission to use the microphone from the Verity side panel.
        Click the button below and <strong>Allow</strong> when Chrome asks.
      </p>
      <button id="grant">Grant microphone access</button>
      <div id="status" class="status"></div>
    </div>
  </body>
</html>
